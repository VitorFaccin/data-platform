# Local Airflow 3.3.1, one command: `docker compose up`.
#
# Deliberately smaller than the official compose file: LocalExecutor instead of Celery
# (no Redis, no separate workers) — a single-node pipeline gains nothing from a
# distributed task queue, and every removed service is one fewer thing to debug.
# The trade-off is documented in README decision 11.
#
# Airflow 3 splits the old webserver into `api-server` (UI + REST + task execution API)
# and makes the `dag-processor` a mandatory standalone component. Both appear below.

x-airflow-common: &airflow-common

  build: .
  image: data-platform-airflow:3.3.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-only-secret}
    AIRFLOW__CORE__AUTH_MANAGER: >-
      airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAG_IGNORE_FILE_SYNTAX: glob
    DATA_PLATFORM_SINK: ${DATA_PLATFORM_SINK:-local}
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
    GCS_LANDING_BUCKET: ${GCS_LANDING_BUCKET:-}
    GCS_LAKEHOUSE_BUCKET: ${GCS_LAKEHOUSE_BUCKET:-}
    BQ_DATASET_GOLD: ${BQ_DATASET_GOLD:-gold}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./plugins:/opt/airflow/plugins
    - ./warehouse:/opt/airflow/warehouse
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 5s
      retries: 10
    volumes:
      - postgres-db:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    command: db migrate
    depends_on: *airflow-common-depends

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/version"]
      interval: 10s
      retries: 12
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  airflow-logs:
